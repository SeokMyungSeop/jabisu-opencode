# 자비수(諮備秀) betas for macOS and Linux: an ad hoc signed, unnotarized dmg for Apple silicon and Intel Macs, and an
# AppImage and a deb for x64 Linux, each kept as a workflow artifact. It needs no secrets and publishes nothing; a
# GitHub pre-release is made by hand.
name: jabisu-beta
run-name: "자비수 맥·리눅스 베타 ${{ inputs.version || github.ref_name }}"

on:
  push:
    branches:
      - jabisu-beta
  workflow_dispatch:
    inputs:
      version:
        description: "자비수 버전 (비우면 1.5.7-beta.<실행 번호>)"
        required: false
        type: string

concurrency:
  group: jabisu-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mac:
    if: github.repository == 'SeokMyungSeop/jabisu-opencode'
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26
            name: Jabisu-mac-apple-silicon
            target: aarch64-apple-darwin
            cli: opencode-darwin-arm64
            arch: arm64
            bun_install_flags: --os=darwin --cpu=arm64
          - host: macos-26-intel
            name: Jabisu-mac-intel
            target: x86_64-apple-darwin
            cli: opencode-darwin-x64-baseline
            arch: x64
            bun_install_flags: --os=darwin --cpu=x64
    runs-on: ${{ matrix.settings.host }}
    timeout-minutes: 120
    env:
      OPENCODE_CHANNEL: jabisu
      # Every build gets its own version: the app reuses an engine it already staged for the same version.
      OPENCODE_VERSION: ${{ inputs.version || format('1.5.7-beta.{0}', github.run_number) }}
      OPENCODE_CLI_TARGET: ${{ matrix.settings.target }}
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Build CLI
        run: bun ./script/build.ts --target=${{ matrix.settings.cli }} --skip-install
        working-directory: packages/cli

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        run: npx electron-builder --mac --${{ matrix.settings.arch }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Check the app
        working-directory: packages/desktop/dist
        run: |
          app=$(find . -maxdepth 2 -name "Jabisu.app" -type d | head -1)
          if [ -z "$app" ]; then
            echo "No Jabisu.app found"
            ls -la
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E "Signature|Identifier|Runtime|flags" || true
          lipo -archs "$app/Contents/MacOS/Jabisu"
          lipo -archs "$app/Contents/Resources/opencode-cli"
          "$app/Contents/Resources/opencode-cli" --version
          ls "$app/Contents/Resources" | grep LICENSE
          ls -la *.dmg

      # Opens the app for a while to catch a crash at launch, such as a signature that keeps a framework from loading.
      - name: Open the app
        continue-on-error: true
        working-directory: packages/desktop/dist
        run: |
          app=$(find . -maxdepth 2 -name "Jabisu.app" -type d | head -1)
          "$app/Contents/MacOS/Jabisu" > launch.log 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "자비수 is still running after 30 seconds"
            kill "$pid"
            # The engine it started runs on as a background service from its staged copy.
            pkill -f opencode-cli || true
            exit 0
          fi
          echo "자비수 exited within 30 seconds"
          tail -50 launch.log
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.settings.name }}
          path: packages/desktop/dist/*.dmg
          if-no-files-found: error
          compression-level: 0

  linux:
    if: github.repository == 'SeokMyungSeop/jabisu-opencode'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OPENCODE_CHANNEL: jabisu
      # The same version as the macOS builds of this run, so one beta has one number.
      OPENCODE_VERSION: ${{ inputs.version || format('1.5.7-beta.{0}', github.run_number) }}
      OPENCODE_CLI_TARGET: x86_64-unknown-linux-gnu
      OPENCODE_CLI_DIST: ${{ github.workspace }}/packages/cli/dist
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Build CLI
        run: bun ./script/build.ts --target=opencode-linux-x64-baseline --skip-install
        working-directory: packages/cli

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop

      - name: Build
        run: bun run build
        working-directory: packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Package
        run: npx electron-builder --linux AppImage deb --x64 --publish never --config electron-builder.config.ts
        working-directory: packages/desktop
        timeout-minutes: 60

      - name: Check the app
        working-directory: packages/desktop/dist
        run: |
          ls -la *.AppImage *.deb
          ./linux-unpacked/resources/opencode-cli --version
          ls linux-unpacked | grep LICENSE
          dpkg-deb --field *.deb Package Version Maintainer

      # Opens the app under a virtual display for a while to catch a crash at launch.
      - name: Open the app
        continue-on-error: true
        working-directory: packages/desktop/dist
        run: |
          command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb; }
          xvfb-run -a ./linux-unpacked/io.github.seokmyungseop.jabisu --no-sandbox > launch.log 2>&1 &
          pid=$!
          sleep 30
          if kill -0 "$pid" 2>/dev/null; then
            echo "자비수 is still running after 30 seconds"
            kill "$pid"
            pkill -f opencode-cli || true
            exit 0
          fi
          echo "자비수 exited within 30 seconds"
          tail -50 launch.log
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Jabisu-linux-x64
          path: |
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
          if-no-files-found: error
          compression-level: 0
